<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Multilingual Content Safety Evaluation Platform Architecture</title>
  <desc id="desc">Architecture showing policy and bilingual data flowing through annotation, classification, evaluation, confidence routing, and product decisions, with reviewer feedback returning to policy and model iteration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="feedback" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 32px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, Arial, sans-serif; fill: #475569; }
      .stage { font: 700 13px Inter, Arial, sans-serif; letter-spacing: 1.3px; fill: #64748b; }
      .box-title { font: 700 19px Inter, Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 14px Inter, Arial, sans-serif; fill: #475569; }
      .metric { font: 700 17px Inter, Arial, sans-serif; fill: #312e81; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .feedback { stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 8 7; fill: none; marker-end: url(#feedback); }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .policy { fill: #eff6ff; stroke: #93c5fd; }
      .human { fill: #faf5ff; stroke: #c4b5fd; }
      .model { fill: #ecfeff; stroke: #67e8f9; }
      .evaluate { fill: #f0fdf4; stroke: #86efac; }
      .route { fill: #fff7ed; stroke: #fdba74; }
      .action { fill: #fff; stroke: #cbd5e1; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)" rx="24"/>
  <text x="70" y="68" class="title">Multilingual Content Safety Evaluation Platform</text>
  <text x="70" y="98" class="subtitle">Policy-grounded evaluation, human review, model comparison, and confidence-based product routing</text>

  <text x="70" y="148" class="stage">1 POLICY AND DATA</text>
  <rect x="70" y="165" width="260" height="190" class="box policy"/>
  <text x="95" y="202" class="box-title">Taxonomy and Dataset</text>
  <text x="95" y="235" class="body">• English and Chinese text</text>
  <text x="95" y="262" class="body">• 5 safety categories</text>
  <text x="95" y="289" class="body">• 110 evaluation examples</text>
  <text x="95" y="316" class="body">• Policy boundary cases</text>
  <text x="95" y="338" class="body">  and adversarial slices</text>

  <text x="390" y="148" class="stage">2 HUMAN GROUND TRUTH</text>
  <rect x="390" y="165" width="260" height="190" class="box human"/>
  <text x="415" y="202" class="box-title">Annotation Workflow</text>
  <text x="415" y="235" class="body">• Blinded second review</text>
  <text x="415" y="262" class="body">• Cohen’s kappa</text>
  <text x="415" y="289" class="body">• Disagreement analysis</text>
  <text x="415" y="316" class="body">• Traceable adjudication</text>
  <text x="415" y="343" class="metric">κ = 0.725–0.938</text>

  <text x="710" y="148" class="stage">3 CLASSIFICATION</text>
  <rect x="710" y="165" width="260" height="190" class="box model"/>
  <text x="735" y="202" class="box-title">Model Layer</text>
  <text x="735" y="235" class="body">• Deterministic rules</text>
  <text x="735" y="262" class="body">• Structured LLM output</text>
  <text x="735" y="289" class="body">• Label and confidence</text>
  <text x="735" y="316" class="body">• Reason and evidence span</text>
  <text x="735" y="343" class="metric">Macro F1 0.160 → 0.980</text>

  <text x="1030" y="148" class="stage">4 EVALUATION</text>
  <rect x="1030" y="165" width="300" height="190" class="box evaluate"/>
  <text x="1055" y="202" class="box-title">Evaluation Framework</text>
  <text x="1055" y="235" class="body">• Precision, recall, macro F1</text>
  <text x="1055" y="262" class="body">• Confusion matrix and slices</text>
  <text x="1055" y="289" class="body">• Error and calibration analysis</text>
  <text x="1055" y="316" class="body">• Threshold sensitivity</text>
  <text x="1055" y="343" class="metric">High-severity recall 100%</text>

  <path d="M330 260 H382" class="arrow"/>
  <path d="M650 260 H702" class="arrow"/>
  <path d="M970 260 H1022" class="arrow"/>

  <text x="455" y="422" class="stage">5 CONFIDENCE ROUTING</text>
  <rect x="455" y="440" width="490" height="105" class="box route"/>
  <text x="480" y="476" class="box-title">Policy-Aware Decision Router</text>
  <text x="480" y="507" class="body">Category severity + model confidence + calibrated threshold</text>
  <text x="480" y="531" class="metric">0.85 threshold sends the sole severe false positive to review</text>
  <path d="M1180 355 C1180 405 945 390 945 465" class="arrow"/>

  <rect x="90" y="620" width="245" height="80" class="box action"/>
  <rect x="415" y="620" width="245" height="80" class="box action"/>
  <rect x="740" y="620" width="245" height="80" class="box action"/>
  <rect x="1065" y="620" width="245" height="80" class="box action"/>
  <text x="159" y="657" class="box-title">Automated Action</text>
  <text x="180" y="683" class="body">High-confidence risk</text>
  <text x="470" y="657" class="box-title">Human Review</text>
  <text x="473" y="683" class="body">Uncertain or high-impact</text>
  <text x="821" y="657" class="box-title">Monitor</text>
  <text x="790" y="683" class="body">Low-confidence safe content</text>
  <text x="1163" y="657" class="box-title">Pass</text>
  <text x="1137" y="683" class="body">High-confidence safe</text>

  <path d="M700 545 V580 H212 V612" class="arrow"/>
  <path d="M700 545 V580 H537 V612" class="arrow"/>
  <path d="M700 545 V580 H862 V612" class="arrow"/>
  <path d="M700 545 V580 H1187 V612" class="arrow"/>

  <path d="M537 620 C537 570 360 575 360 395 C360 368 390 350 415 350" class="feedback"/>
  <text x="245" y="570" class="body" fill="#7c3aed">Reviewer feedback drives policy, prompt, and threshold iteration</text>
</svg>
